[profile.default]
src = "contracts/src"
test = "tests/contracts"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/"]
[profile.default.fuzz]
runs = 256
